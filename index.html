<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>День Дождя!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="checkbox" id="click-checkbox" class="checkbox-control">
    <div class="rain-container">
        <div class="kap k1">💧</div>
        <div class="kap k2">💧</div>
        <div class="kap k3">💧</div>
        <div class="kap k4">💧</div>
    </div>
    <div class="card">
        <div class="icon-zone">
            <div class="sun">☀️</div>
            <div class="cloud">🌧️</div>
        </div>

        <h1>С Днем Дождя!</h1>
        <p>Нажми на кнопку, чтобы пошел дождь.</p>
        
        <label for="click-checkbox" class="btn-rain">Вызвать дождь</label>
    </div>
    
</body>
</html>
